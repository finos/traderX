<h5>Positions</h5>
<div class="d-flex align-items-center gap-2 mb-2">
  <label>Positions ticker filter
    <select class="form-select form-select-sm" [value]="filterOnSelectedTicker ? 'selected' : 'all'"
        (change)="setTickerFilter($any($event.target).value === 'selected')">
      <option value="all">All tickers</option>
      <option value="selected">Filter on selected ticker</option>
    </select>
  </label>
  <span role="status" aria-live="polite">{{ tickerFilterDescription }}</span>
</div>


<ag-grid-angular [isExternalFilterPresent]="isExternalFilterPresent" [doesExternalFilterPass]="doesExternalFilterPass" #agGrid style="width: 100%; height: 350px;" id="myGrid" class="ag-theme-alpine"
    [columnDefs]="columnDefs" [rowData]="positions" (gridReady)="onGridReady($event)" (rowClicked)="onRowClicked($event)" [getRowId]="getRowId">
</ag-grid-angular>
