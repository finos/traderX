name: Security Scanning

on:
  workflow_dispatch:
  push:
    branches:
      - code/generated-state-*

jobs:
  node-modules-scan:
    name: ${{ matrix.module_folder }}-node-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module_folder:
          - price-publisher
          - reference-data
          - web-front-end/angular
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install production dependencies
        run: npm ci --omit=dev
        working-directory: ${{ matrix.module_folder }}
      - name: Prepare artifact name
        shell: bash
        run: |
          echo "UPNAME=$(echo '${{ matrix.module_folder }}' | tr '/\\ ' '---' | tr -cd '[:alnum:]._-')" >> "${GITHUB_ENV}"
      - name: Dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ matrix.module_folder }}
          path: ${{ matrix.module_folder }}
          format: HTML
          out: ${{ matrix.module_folder }}-reports
          args: >
            --suppression .github/node-cve-ignore-list.xml
            --nodeAuditSkipDevDependencies
            --nodePackageSkipDevDependencies
            --failOnCVSS 5
            --enableRetired
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-node-${{ env.UPNAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ matrix.module_folder }}-reports

  dotnet-modules-scan:
    name: ${{ matrix.module_folder }}-dotnet-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module_folder:
          - people-service/PeopleService.WebApi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build project
        run: dotnet build --configuration Release
        working-directory: ${{ matrix.module_folder }}
      - name: Prepare artifact name
        shell: bash
        run: |
          echo "UPNAME=$(echo '${{ matrix.module_folder }}' | tr '/\\ ' '---' | tr -cd '[:alnum:]._-')" >> "${GITHUB_ENV}"
      - name: Dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ matrix.module_folder }}
          path: ${{ matrix.module_folder }}
          format: HTML
          out: ${{ matrix.module_folder }}-reports
          args: >
            --suppression .github/dotnet-cve-ignore-list.xml
            --failOnCVSS 5
            --enableRetired
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-dotnet-${{ env.UPNAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ matrix.module_folder }}-reports

  gradle-modules-scan:
    name: ${{ matrix.module_folder }}-gradle-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module_folder:
          - account-service
          - database
          - position-service
          - trade-processor
          - trade-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build project
        shell: bash
        working-directory: ${{ matrix.module_folder }}
        run: |
          if [[ -x ./gradlew ]]; then
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi
      - name: Prepare artifact name
        shell: bash
        run: |
          echo "UPNAME=$(echo '${{ matrix.module_folder }}' | tr '/\\ ' '---' | tr -cd '[:alnum:]._-')" >> "${GITHUB_ENV}"
      - name: Dependency check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: ${{ matrix.module_folder }}
          path: ${{ matrix.module_folder }}
          format: HTML
          out: ${{ matrix.module_folder }}-reports
          args: >
            --suppression .github/gradle-cve-ignore-list.xml
            --failOnCVSS 5
            --enableRetired
            --disableCentral
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-gradle-${{ env.UPNAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ matrix.module_folder }}-reports

  docker-image-scan:
    name: ${{ matrix.image_name }}-docker-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: account-service
            dockerfile: Dockerfile.compose
            image_name: account-service
          - directory: database
            dockerfile: Dockerfile.compose
            image_name: database
          - directory: ingress
            dockerfile: Dockerfile.compose
            image_name: ingress
          - directory: people-service
            dockerfile: Dockerfile.compose
            image_name: people-service
          - directory: position-service
            dockerfile: Dockerfile.compose
            image_name: position-service
          - directory: price-publisher
            dockerfile: Dockerfile.compose
            image_name: price-publisher
          - directory: pricing-awareness-market-data/runtime-images/blackbox-exporter
            dockerfile: Dockerfile.compose
            image_name: blackbox-exporter
          - directory: pricing-awareness-market-data/runtime-images/loki
            dockerfile: Dockerfile.compose
            image_name: loki
          - directory: pricing-awareness-market-data/runtime-images/prometheus
            dockerfile: Dockerfile.compose
            image_name: prometheus
          - directory: pricing-awareness-market-data/runtime-images/tempo
            dockerfile: Dockerfile.compose
            image_name: tempo
          - directory: reference-data
            dockerfile: Dockerfile.compose
            image_name: reference-data
          - directory: trade-processor
            dockerfile: Dockerfile.compose
            image_name: trade-processor
          - directory: trade-service
            dockerfile: Dockerfile.compose
            image_name: trade-service
          - directory: web-front-end/angular
            dockerfile: Dockerfile.compose
            image_name: web-front-end-angular
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scan
        run: docker build --platform linux/amd64 -f "${{ matrix.directory }}/${{ matrix.dockerfile }}" -t "traderx-security/${{ matrix.image_name }}:scan" "${{ matrix.directory }}"
      - name: Restore scanner databases (freshness checked after download)
        uses: actions/cache@v4
        with:
          path: |
            .runtime-security-cache/db
            .runtime-security-cache/java-db
          key: runtime-databases-${{ runner.os }}-${{ hashFiles('ci/dependency-version-targets.json') }}-${{ github.run_id }}
          restore-keys: runtime-databases-${{ runner.os }}-${{ hashFiles('ci/dependency-version-targets.json') }}-
      - name: Scan immutable local build and record exact-run evidence
        run: python3 ci/nonpublishing_runtime_security.py --module '${{ matrix.image_name }}'
      - name: Retain local build scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-image-${{ matrix.image_name }}-${{ github.run_attempt }}
          path: runtime-security-reports/
          if-no-files-found: error
          retention-days: 14

  runtime-image-security:
    name: Runtime Image Security (build only)
    needs: docker-image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install pinned Kubernetes manifest parser
        run: |
          version=$(jq -er '.security.kubernetesManifestParser | select(.package == "PyYAML") | .version' ci/dependency-version-targets.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 -m pip install --disable-pip-version-check "PyYAML==$version"
      - name: Install checksum-pinned Kubernetes manifest renderer
        run: |
          version=$(jq -er '.security.kubernetesManifestRenderer.version' ci/dependency-version-targets.json)
          checksum=$(jq -er '.security.kubernetesManifestRenderer.sha256' ci/dependency-version-targets.json)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" -o kubectl
          printf '%s  kubectl\n' "$checksum" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Download exact-run local scan evidence
        uses: actions/download-artifact@v4
        with:
          pattern: local-image-*-${{ github.run_attempt }}
          path: local-images
      - name: Restore scanner databases (freshness checked after download)
        uses: actions/cache@v4
        with:
          path: |
            .runtime-security-cache/db
            .runtime-security-cache/java-db
          key: runtime-databases-${{ runner.os }}-${{ hashFiles('ci/dependency-version-targets.json') }}-${{ github.run_id }}
          restore-keys: runtime-databases-${{ runner.os }}-${{ hashFiles('ci/dependency-version-targets.json') }}-
      - name: Scan complete build-only runtime inventory
        run: python3 ci/nonpublishing_runtime_security.py --artifacts local-images
      - name: Retain full inventory and diagnostics (not deployment authorization)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-only-runtime-diagnostics-${{ github.run_attempt }}
          path: runtime-security-reports/
          if-no-files-found: error
          retention-days: 14
