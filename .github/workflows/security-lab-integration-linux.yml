name: Security Lab Linux Integration
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Hosted acceptance scope (full suite remains required before acceptance)
        type: choice
        default: all
        options:
          - all
          - position-image
          - java-core-images
  pull_request:
    paths:
      - 'scripts/security-lab/**'
      - 'specs/012-platform-convergence-c3/security-lab/**'
      - 'specs/019-traderx-security-lab/system/linux-integration.md'
      - 'specs/019-traderx-security-lab/system/sql/**'
      - 'specs/019-traderx-security-lab/system/jetstream-images.lock.json'
      - 'specs/019-traderx-security-lab/system/runtime-images.lock.json'
      - 'specs/019-traderx-security-lab/system/java-runtime-images.lock.json'
      - 'specs/019-traderx-security-lab/generation/**'
      - '.github/workflows/security-lab-integration-linux.yml'
permissions:
  contents: read
jobs:
  integration:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install existing fixture dependencies
        run: |
          python -m pip install -r scripts/security-lab/requirements.txt
          python -m pip install 'cryptography==50.0.2' 'PyJWT==2.15.1'
          python -m pip install --require-hashes -r scripts/security-lab/requirements-delivery.txt
      - name: Fetch pinned baseline
        run: python scripts/security-lab/checkpoint.py fetch-baseline
      - name: Check portability boundaries
        run: |
          python -m unittest discover -s scripts/security-lab -p 'test_portability.py'
          python -m unittest discover -s scripts/security-lab -p 'test_resource_preflight.py'
          python -m unittest discover -s scripts/security-lab -p 'test_trading_security.py'
          python -m unittest discover -s scripts/security-lab -p 'test_read_security.py'
          python -m unittest discover -s scripts/security-lab -p 'test_event_delivery.py'
          python -m unittest discover -s scripts/security-lab -p 'test_delivery_worker.py'
          python -m unittest discover -s scripts/security-lab -p 'test_event_delivery_adversarial.py'
          python -m unittest discover -s scripts/security-lab -p 'test_application_consumers.py'
          python -m unittest discover -s scripts/security-lab -p 'test_browser_api.py'
          python -m unittest discover -s scripts/security-lab -p 'test_browser_session.py'
          python -m unittest discover -s scripts/security-lab -p 'test_browser_broker.py'
          python -m unittest discover -s scripts/security-lab -p 'test_browser_runtime.py'
          python -m unittest discover -s scripts/security-lab -p 'test_browser_assets.py'
          python -m unittest discover -s scripts/security-lab -p 'test_authenticated_trading.py'
          python -m unittest discover -s scripts/security-lab -p 'test_order_consumers.py'
          python -m unittest discover -s scripts/security-lab -p 'test_portfolio_consumers.py'
          python -m unittest discover -s scripts/security-lab -p 'test_integrated_deployment.py'
          python -m unittest discover -s scripts/security-lab -p 'test_private_materializer.py'
      - name: Build candidates and exercise HTTP to PostgreSQL
        shell: bash
        env:
          TRADERX_LAB_ISOLATED_LINUX: '1'
        run: |
          set -euo pipefail
          umask 077
          runtime="$(mktemp -d "$RUNNER_TEMP/traderx-security-integration.XXXXXXXX")"
          trap 'rm -rf "$runtime"' EXIT
          mkdir "$runtime/evidence"
          python scripts/security-lab/build_trading_security.py --runtime-dir "$runtime" --java-home "$JAVA_HOME"
          python scripts/security-lab/render_read_security.py --output-dir "$runtime/position-service"
          (cd "$runtime/position-service" && bash gradlew --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=256m' test bootJar)
          python scripts/security-lab/verify_browser_api.py --runtime-dir "$runtime" --output "$runtime/evidence/browser-api.json"
          # Independent candidates share built artifacts, never live containers.
          # A failure stays red but must not hide the other campaign's result.
          candidate_failed=0
          python scripts/security-lab/verify_browser_broker.py --runtime-dir "$runtime" --output "$runtime/evidence/browser-broker.json" || candidate_failed=1
          python scripts/security-lab/verify_authenticated_trading.py --runtime-dir "$runtime" --output "$runtime/evidence/authenticated-trading.json" || candidate_failed=1
          python scripts/security-lab/verify_execution_http.py --runtime-dir "$runtime" --output "$runtime/evidence/http.json"
          python scripts/security-lab/verify_execution_events.py --runtime-dir "$runtime" --output "$runtime/evidence/events.json"
          python scripts/security-lab/verify_execution_adversarial.py --runtime-dir "$runtime" --output "$runtime/evidence/adversarial.json"
          python scripts/security-lab/verify_event_delivery.py --runtime-dir "$runtime" --output "$runtime/evidence/broker-delivery.json"
          python scripts/security-lab/verify_event_delivery_adversarial.py --runtime-dir "$runtime" --output "$runtime/evidence/broker-adversarial.json"
          python scripts/security-lab/verify_worker_process.py --runtime-dir "$runtime" --output "$runtime/evidence/worker-process.json"
          test "$candidate_failed" = 0
  application-consumers:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all'
    # Separate hosted runner and generated root; no shared generation targets.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate pinned application consumer candidate
        run: |
          python -m pip install -r scripts/security-lab/requirements.txt
          python scripts/security-lab/checkpoint.py fetch-baseline
          python scripts/security-lab/render_application_consumers.py --output-dir "$RUNNER_TEMP/security-frontend"
      - name: Test actual blotters and build Angular candidate
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          NG_CLI_ANALYTICS: 'false'
        run: |
          cd "$RUNNER_TEMP/security-frontend"
          npm ci --ignore-scripts --no-audit --no-fund
          export CHROME_BIN="$(command -v google-chrome)"
          test -x "$CHROME_BIN"
          npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --include='main/app/security/*.spec.ts'
          npm run build
          PYTHONPATH="$GITHUB_WORKSPACE/scripts/security-lab" python - <<'PY'
          from pathlib import Path
          from browser_assets import PublicAssets
          assets = PublicAssets(Path('dist/main-application/browser').resolve())
          assert assets.get('/trade') == assets.get('/')
          assert assets.get('/config.json') is None
          print('Actual production Angular assets accepted by the session runtime allowlist.')
          PY
  people-authorization:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Build operator-only directory candidate and verify live identity
        env:
          TRADERX_LAB_ISOLATED_LINUX: '1'
        run: |
          set -euo pipefail
          umask 077
          python -m pip install -r scripts/security-lab/requirements.txt
          python -m pip install 'cryptography==50.0.2' 'PyJWT==2.15.1'
          python scripts/security-lab/checkpoint.py fetch-baseline
          python -m unittest discover -s scripts/security-lab -p 'test_people_security.py'
          runtime="$(mktemp -d "$RUNNER_TEMP/traderx-people-integration.XXXXXXXX")"
          trap 'rm -rf "$runtime"' EXIT
          python scripts/security-lab/render_people_security.py --output-dir "$runtime/people-service"
          dotnet build "$runtime/people-service/PeopleService.WebApi/PeopleService.WebApi.csproj" -c Release --disable-build-servers
          python scripts/security-lab/verify_people_security.py --runtime-dir "$runtime" --output "$runtime/people-result.json"
  integrated-admission:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all'
    # Independent disposable control plane: schema/policy only, no application activation.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate compiler and private configuration
        run: |
          python -m pip install -r scripts/security-lab/requirements.txt
          python -m unittest discover -s scripts/security-lab -p 'test_integrated_deployment.py'
          python -m unittest discover -s scripts/security-lab -p 'test_private_materializer.py'
          python -m unittest discover -s scripts/security-lab -p 'test_integrated_admission.py'
      - name: Verify staged workload admission against an isolated Kubernetes API
        env:
          TRADERX_LAB_ISOLATED_LINUX: '1'
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          pin = json.loads(pathlib.Path('specs/019-traderx-security-lab/system/admission-tools.lock.json').read_text())['kind']
          with urllib.request.urlopen(pin['url'], timeout=90) as response:
              data = response.read(32 * 1024 * 1024 + 1)
          assert len(data) <= 32 * 1024 * 1024 and hashlib.sha256(data).hexdigest() == pin['sha256']
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kind-v0.31.0'
          with path.open('xb') as output: output.write(data)
          path.chmod(0o700)
          PY
          python scripts/security-lab/verify_integrated_admission.py --kind "$RUNNER_TEMP/kind-v0.31.0" --runtime-dir "$RUNNER_TEMP/traderx-admission" --output "$RUNNER_TEMP/traderx-admission-evidence.json"
  browser-journey:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all'
    # One real browser and its actual APIs on a dedicated disposable runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and exercise the actual browser trading journey
        env:
          TRADERX_LAB_ISOLATED_LINUX: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          NG_CLI_ANALYTICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
          python -m pip install -r scripts/security-lab/requirements.txt
          python -m pip install 'cryptography==50.0.2' 'PyJWT==2.15.1'
          python -m pip install --require-hashes -r scripts/security-lab/requirements-delivery.txt
          python scripts/security-lab/checkpoint.py fetch-baseline
          runtime="$(mktemp -d "$RUNNER_TEMP/traderx-browser-journey.XXXXXXXX")"
          cleanup_browser_journey() {
            for service in trade-service order-matcher trade-processor account-service; do
              summary="$runtime/evidence/build-failure-$service.json"
              if [ -f "$summary" ]; then
                cp "$summary" "$RUNNER_TEMP/browser-build-failure-$service.json"
              fi
            done
            rm -rf "$runtime"
          }
          trap cleanup_browser_journey EXIT
          mkdir "$runtime/evidence"
          python -m unittest discover -s scripts/security-lab -p 'test_build_diagnostics.py'
          python scripts/security-lab/build_trading_security.py --runtime-dir "$runtime" --java-home "$JAVA_HOME"
          python scripts/security-lab/build_account_security.py --runtime-dir "$runtime" --java-home "$JAVA_HOME"
          python scripts/security-lab/render_read_security.py --output-dir "$runtime/position-service"
          (cd "$runtime/position-service" && bash gradlew --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=256m' test bootJar)
          python scripts/security-lab/render_application_consumers.py --output-dir "$runtime/application-consumers"
          (cd "$runtime/application-consumers" && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          export CHROME_BIN="$(command -v google-chrome)"
          test -x "$CHROME_BIN"
          python -m unittest discover -s scripts/security-lab -p 'test_browser_journey*.py'
          python scripts/security-lab/verify_browser_journey.py --runtime-dir "$runtime" --output "$runtime/evidence/browser-journey.json"
          cp "$runtime/evidence/browser-journey.json" "$RUNNER_TEMP/browser-journey.json"
      - uses: actions/upload-artifact@v4
        with:
          name: security-browser-journey
          path: ${{ runner.temp }}/browser-journey.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: security-browser-build-diagnostics
          path: ${{ runner.temp }}/browser-build-failure-*.json
          if-no-files-found: warn
          retention-days: 7
  runtime-images:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all'
    # Sequential image builds on a disposable hosted runner; nothing is published.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build Python images and verify private launchers and TLS delivery
        env:
          TRADERX_LAB_ISOLATED_LINUX: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          NG_CLI_ANALYTICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          python -m pip install -r scripts/security-lab/requirements.txt
          python -m pip install 'cryptography==50.0.2' 'PyJWT==2.15.1'
          python -m pip install --require-hashes -r scripts/security-lab/requirements-delivery.txt
          python -m unittest discover -s scripts/security-lab -p 'test_runtime_images*.py'
          python -m unittest discover -s scripts/security-lab -p 'test_worker_image*.py'
          python scripts/security-lab/checkpoint.py fetch-baseline
          runtime="$(mktemp -d "$RUNNER_TEMP/traderx-runtime-images.XXXXXXXX")"
          builder="traderx-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true; rm -rf "$runtime"' EXIT
          mkdir "$runtime/evidence"
          python scripts/security-lab/render_application_consumers.py --output-dir "$runtime/frontend"
          (cd "$runtime/frontend" && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          python scripts/security-lab/runtime_images.py fetch-wheels --output "$runtime/wheels"
          buildkit="$(python -c 'import json; print(json.load(open("specs/019-traderx-security-lab/system/runtime-images.lock.json"))["buildkit"]["reference"])')"
          docker buildx create --name "$builder" --driver docker-container --driver-opt "image=$buildkit"
          for role in browser-session event-publisher event-consumer; do
            frontend=()
            if [ "$role" = browser-session ]; then frontend=(--frontend-root "$runtime/frontend"); fi
            python scripts/security-lab/runtime_images.py prepare --role "$role" --wheelhouse "$runtime/wheels" "${frontend[@]}" --source-commit "$GITHUB_SHA" --output "$runtime/context-$role" > "$runtime/evidence/build-$role.json"
            reference="traderx-local/$role:$GITHUB_SHA"
            docker buildx build --builder "$builder" --platform linux/amd64 --network none --provenance=false --sbom=false --tag "$reference" --output "type=oci,oci-mediatypes=true,dest=$runtime/$role.oci.tar" --output "type=docker,dest=$runtime/$role.docker.tar" "$runtime/context-$role"
            python - "$runtime/$role.oci.tar" "$runtime/oci-$role" <<'PY'
          import pathlib, sys, tarfile
          destination = pathlib.Path(sys.argv[2]); destination.mkdir()
          with tarfile.open(sys.argv[1]) as archive:
              archive.extractall(destination, filter='data')
          PY
            python scripts/security-lab/runtime_images.py inspect --role "$role" --layout "$runtime/oci-$role" --image-name "$reference" --source-commit "$GITHUB_SHA" > "$runtime/image-$role.json"
            docker load --input "$runtime/$role.docker.tar"
          done
          docker buildx rm "$builder"
          python - "$runtime" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          images = {}
          for role in ('browser-session', 'event-publisher', 'event-consumer'):
              entry = json.loads((root / ('image-' + role + '.json')).read_text())
              entry['runtime_reference'] = 'traderx-local/' + role + ':' + sys.argv[2]
              images[role] = entry
          (root / 'images.json').write_text(json.dumps({'source_commit': sys.argv[2], 'images': images}))
          PY
          python scripts/security-lab/verify_runtime_images.py --runtime-dir "$runtime" --images "$runtime/images.json" --output "$runtime/evidence/runtime-images.json"
          cp "$runtime/evidence/runtime-images.json" "$RUNNER_TEMP/runtime-images.json"
          python scripts/security-lab/verify_worker_images.py --runtime-dir "$runtime" --images "$runtime/images.json" --output "$runtime/evidence/worker-images.json"
          cp "$runtime/evidence/worker-images.json" "$RUNNER_TEMP/worker-images.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: security-runtime-images
          path: ${{ runner.temp }}/runtime-images.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: security-worker-image-delivery
          path: ${{ runner.temp }}/worker-images.json
          if-no-files-found: error
          retention-days: 7
  position-image:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all' || inputs.campaign == 'position-image'
    # Independent hosted runner; private fixture data and images are never published.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify protected position image with HTTPS and PostgreSQL TLS
        env:
          TRADERX_LAB_ISOLATED_LINUX: '1'
        run: |
          set -euo pipefail
          umask 077
          python -m pip install -r scripts/security-lab/requirements.txt
          python -m pip install 'cryptography==50.0.2' 'PyJWT==2.15.1'
          python -m pip install --require-hashes -r scripts/security-lab/requirements-delivery.txt
          python scripts/security-lab/checkpoint.py fetch-baseline
          python -m unittest discover -s scripts/security-lab -p 'test_java*.py'
          python -m unittest discover -s scripts/security-lab -p 'test_position_image.py'
          runtime="$(mktemp -d "$RUNNER_TEMP/traderx-position-image.XXXXXXXX")"
          builder="traderx-position-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true; rm -rf "$runtime"' EXIT
          mkdir "$runtime/evidence"
          python scripts/security-lab/build_position_security.py --runtime-dir "$runtime" --java-home "$JAVA_HOME"
          python scripts/security-lab/java_images.py prepare --generated-root "$runtime/position-security-build" --build-report "$runtime/evidence/position-security-build.json" --source-commit "$GITHUB_SHA" --output "$runtime/context-position-service"
          buildkit="$(python -c 'import json; print(json.load(open("specs/019-traderx-security-lab/system/runtime-images.lock.json"))["buildkit"]["reference"])')"
          docker buildx create --name "$builder" --driver docker-container --driver-opt "image=$buildkit"
          reference="traderx-local/position-service:$GITHUB_SHA"
          docker buildx build --builder "$builder" --platform linux/amd64 --network none --provenance=false --sbom=false --tag "$reference" --output "type=oci,oci-mediatypes=true,dest=$runtime/position.oci.tar" --output "type=docker,dest=$runtime/position.docker.tar" "$runtime/context-position-service"
          python - "$runtime/position.oci.tar" "$runtime/oci-position-service" <<'PY'
          import pathlib, sys, tarfile
          destination = pathlib.Path(sys.argv[2]); destination.mkdir()
          with tarfile.open(sys.argv[1]) as archive:
              archive.extractall(destination, filter='data')
          PY
          python scripts/security-lab/java_images.py inspect --layout "$runtime/oci-position-service" --image-name "$reference" --source-commit "$GITHUB_SHA" --generated-root "$runtime/position-security-build" --build-report "$runtime/evidence/position-security-build.json" > "$runtime/image-entry.json"
          docker load --input "$runtime/position.docker.tar"
          docker buildx rm "$builder"
          python - "$runtime" "$GITHUB_SHA" "$reference" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = {'source_commit': sys.argv[2], 'runtime_reference': sys.argv[3],
                      'image': json.loads((root / 'image-entry.json').read_text()),
                      'generated_root': str(root / 'position-security-build'),
                      'build_report': str(root / 'evidence/position-security-build.json')}
          (root / 'position-image.json').write_text(json.dumps(manifest))
          PY
          result=0
          python scripts/security-lab/verify_position_image.py --runtime-dir "$runtime" --image "$runtime/position-image.json" --output "$runtime/evidence/position-image.json" || result=$?
          cp "$runtime/evidence/position-image.json" "$RUNNER_TEMP/position-image.json"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: security-position-image
          path: ${{ runner.temp }}/position-image.json
          if-no-files-found: warn
          retention-days: 7
  java-core-images:
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'all' || inputs.campaign == 'java-core-images'
    # Independent hosted runner; private fixture data and images are never published.
    name: ${{ matrix.role }}-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: account-service
            build: account
            verifier: account
          - role: trade-processor
            build: processor
            verifier: processor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify protected account or processor image
        env:
          TRADERX_LAB_ISOLATED_LINUX: '1'
          LAB_ROLE: ${{ matrix.role }}
          LAB_BUILD: ${{ matrix.build }}
          LAB_VERIFIER: ${{ matrix.verifier }}
        run: |
          set -euo pipefail
          umask 077
          python -m pip install -r scripts/security-lab/requirements.txt
          python -m pip install 'cryptography==50.0.2' 'PyJWT==2.15.1'
          python -m pip install --require-hashes -r scripts/security-lab/requirements-delivery.txt
          python scripts/security-lab/checkpoint.py fetch-baseline
          python -m unittest discover -s scripts/security-lab -p 'test_java*.py'
          python -m unittest discover -s scripts/security-lab -p "test_${LAB_VERIFIER}_image.py"
          runtime="$(mktemp -d "$RUNNER_TEMP/traderx-core-image.XXXXXXXX")"
          builder="traderx-${LAB_ROLE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true; rm -rf "$runtime"' EXIT
          mkdir "$runtime/evidence"
          python scripts/security-lab/build_java_security.py --role "$LAB_ROLE" --runtime-dir "$runtime" --java-home "$JAVA_HOME"
          python scripts/security-lab/java_images.py prepare --role "$LAB_ROLE" --generated-root "$runtime/${LAB_BUILD}-security-build" --build-report "$runtime/evidence/${LAB_BUILD}-security-build.json" --source-commit "$GITHUB_SHA" --output "$runtime/context-core"
          buildkit="$(python -c 'import json; print(json.load(open("specs/019-traderx-security-lab/system/runtime-images.lock.json"))["buildkit"]["reference"])')"
          docker buildx create --name "$builder" --driver docker-container --driver-opt "image=$buildkit"
          reference="traderx-local/${LAB_ROLE}:$GITHUB_SHA"
          docker buildx build --builder "$builder" --platform linux/amd64 --network none --provenance=false --sbom=false --tag "$reference" --output "type=oci,oci-mediatypes=true,dest=$runtime/core.oci.tar" --output "type=docker,dest=$runtime/core.docker.tar" "$runtime/context-core"
          python - "$runtime/core.oci.tar" "$runtime/oci-core" <<'PY'
          import pathlib, sys, tarfile
          destination = pathlib.Path(sys.argv[2]); destination.mkdir()
          with tarfile.open(sys.argv[1]) as archive:
              archive.extractall(destination, filter='data')
          PY
          python scripts/security-lab/java_images.py inspect --role "$LAB_ROLE" --layout "$runtime/oci-core" --image-name "$reference" --source-commit "$GITHUB_SHA" --generated-root "$runtime/${LAB_BUILD}-security-build" --build-report "$runtime/evidence/${LAB_BUILD}-security-build.json" > "$runtime/image-entry.json"
          docker load --input "$runtime/core.docker.tar"
          docker buildx rm "$builder"
          python - "$runtime" "$GITHUB_SHA" "$reference" "$LAB_BUILD" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = {'source_commit': sys.argv[2], 'runtime_reference': sys.argv[3],
                      'image': json.loads((root / 'image-entry.json').read_text()),
                      'generated_root': str(root / (sys.argv[4] + '-security-build')),
                      'build_report': str(root / 'evidence' / (sys.argv[4] + '-security-build.json'))}
          (root / 'core-image.json').write_text(json.dumps(manifest))
          PY
          result=0
          python scripts/security-lab/verify_${LAB_VERIFIER}_image.py --runtime-dir "$runtime" --image "$runtime/core-image.json" --output "$runtime/evidence/core-image.json" || result=$?
          cp "$runtime/evidence/core-image.json" "$RUNNER_TEMP/core-image.json"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: security-${{ matrix.role }}-image
          path: ${{ runner.temp }}/core-image.json
          if-no-files-found: warn
          retention-days: 7
