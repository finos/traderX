name: Build and Publish Application Images

on:
  workflow_dispatch:
  push:
    branches:
      - code/generated-state-*

env:
  GHCR_ORG: ghcr.io/finos
  IMAGE_NAMESPACE: traderx-c3

jobs:
  build-ghcr:
    name: Build and push ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: account-service
            dockerfile: Dockerfile.compose
            image_name: account-service
          - directory: api-explorer
            dockerfile: Dockerfile
            image_name: api-explorer
          - directory: database
            dockerfile: Dockerfile.compose
            image_name: database
          - directory: ingress
            dockerfile: Dockerfile.compose
            image_name: ingress
          - directory: kubernetes-runtime/runtime-images/blackbox-exporter
            dockerfile: Dockerfile.compose
            image_name: blackbox-exporter
          - directory: kubernetes-runtime/runtime-images/loki
            dockerfile: Dockerfile.compose
            image_name: loki
          - directory: kubernetes-runtime/runtime-images/prometheus
            dockerfile: Dockerfile.compose
            image_name: prometheus
          - directory: kubernetes-runtime/runtime-images/tempo
            dockerfile: Dockerfile.compose
            image_name: tempo
          - directory: order-matcher
            dockerfile: Dockerfile.compose
            image_name: order-matcher
          - directory: people-service
            dockerfile: Dockerfile.compose
            image_name: people-service
          - directory: position-service
            dockerfile: Dockerfile.compose
            image_name: position-service
          - directory: price-publisher
            dockerfile: Dockerfile.compose
            image_name: price-publisher
          - directory: reference-data
            dockerfile: Dockerfile.compose
            image_name: reference-data
          - directory: trade-processor
            dockerfile: Dockerfile.compose
            image_name: trade-processor
          - directory: trade-service
            dockerfile: Dockerfile.compose
            image_name: trade-service
          - directory: web-front-end/angular
            dockerfile: Dockerfile.compose
            image_name: web-front-end-angular
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: GHCR auth mode
        run: |
          if [[ -n "${{ secrets.GHCR_PUSH_TOKEN }}" ]]; then
            echo "Using GHCR_PUSH_TOKEN secret for package publish."
          else
            echo "Using GITHUB_TOKEN for package publish."
            echo "If publish fails with write_package, either:"
            echo "1) enable package write for Actions in repo/org settings, or"
            echo "2) set GHCR_PUSH_TOKEN (packages:write) and GHCR_PUSH_USERNAME secrets."
          fi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUSH_USERNAME != '' && secrets.GHCR_PUSH_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN != '' && secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.directory }}
          file: ${{ matrix.directory }}/${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GHCR_ORG }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ env.GHCR_ORG }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:latest
      - name: Scan published image
        uses: crazy-max/ghaction-container-scan@v3
        with:
          image: ${{ env.GHCR_ORG }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}@${{ steps.publish.outputs.digest }}
          severity: HIGH
      - name: Record scanned image digest
        env:
          IMAGE: ${{ env.GHCR_ORG }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          jq -n --arg snapshot "$GITHUB_SHA" --arg image "$IMAGE" --arg digest "$DIGEST" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{snapshot:$snapshot,image:$image,digest:$digest,run_id:$run_id,run_attempt:$run_attempt}' > image.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image_name }}-${{ github.run_attempt }}
          path: image.json
          if-no-files-found: error

  runtime-image-security:
    name: Runtime Image Security
    needs: build-ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install pinned Kubernetes manifest parser
        run: |
          version=$(jq -er '.security.kubernetesManifestParser | select(.package == "PyYAML") | .version' ci/dependency-version-targets.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 -m pip install --disable-pip-version-check "PyYAML==$version"
      - name: Install checksum-pinned Kubernetes manifest renderer
        run: |
          version=$(jq -er '.security.kubernetesManifestRenderer.version' ci/dependency-version-targets.json)
          checksum=$(jq -er '.security.kubernetesManifestRenderer.sha256' ci/dependency-version-targets.json)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" -o kubectl
          printf '%s  kubectl\n' "$checksum" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Download exact-run published image evidence
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*-${{ github.run_attempt }}
          path: published-images
      - name: Inventory and scan complete runtime
        run: python3 ci/runtime_image_security.py --published published-images
      - name: Retain complete runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-security-diagnostics-${{ github.run_attempt }}
          path: runtime-security-reports/
          if-no-files-found: error
          retention-days: 14
      - name: Publish successful runtime authorization
        uses: actions/upload-artifact@v4
        with:
          name: runtime-lock-${{ github.run_attempt }}
          path: runtime-lock.json
          if-no-files-found: error
